name: Build AvsarGo V12 Android test APK
on:
  workflow_dispatch:
  push:
    branches: [main, master, 'android/**']
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Prepare Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Run deterministic regression checks
        run: |
          node tests/form-agent.test.cjs
          node tests/ui-workflow.test.cjs
          mkdir -p /tmp/avsargo-v12-tests
          javac -d /tmp/avsargo-v12-tests app/src/main/java/com/avsargo/mobile/ProfileRules.java tests/ProfileRulesTest.java
          java -cp /tmp/avsargo-v12-tests ProfileRulesTest
      - name: Lint and compile Android APK
        run: gradle --no-daemon :app:lintDebug :app:assembleDebug
      - name: Verify APK package and signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk > apk-package.txt
          cp app/build/outputs/apk/debug/app-debug.apk AvsarGo_AI_V12_Android_Test.apk
          sha256sum AvsarGo_AI_V12_Android_Test.apk > AvsarGo_AI_V12_Android_Test.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: AvsarGo-AI-V12-Android-Test-APK
          path: |
            AvsarGo_AI_V12_Android_Test.apk
            AvsarGo_AI_V12_Android_Test.apk.sha256
            apk-package.txt
          if-no-files-found: error
          retention-days: 14
