name: Build AvsarGo V14 Android and admin
on:
  workflow_dispatch:
  push:
    branches: [main, master, 'android/**']
    paths: ['app/**', 'tests/**', 'build.gradle', 'settings.gradle', 'gradle/**', 'gradle.properties', 'scripts/visual-check.mjs', '.github/workflows/android-debug-apk.yml']
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Prepare Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Run app and backend regression checks
        run: |
          node tests/form-agent.test.cjs
          node tests/ui-workflow.test.cjs
          node --test server/test/*.test.mjs
          mkdir -p /tmp/avsargo-v14-tests
          javac -d /tmp/avsargo-v14-tests app/src/main/java/com/avsargo/mobile/ProfileRules.java tests/ProfileRulesTest.java
          java -cp /tmp/avsargo-v14-tests ProfileRulesTest
      - name: Lint and compile Android APK
        run: gradle --no-daemon :app:lintDebug :app:assembleDebug
      - name: Verify APK package and signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk > apk-package.txt
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" apksigner.jar
          cp app/build/outputs/apk/debug/app-debug.apk AvsarGo_AI_V14_Android_Test.apk
          sha256sum AvsarGo_AI_V14_Android_Test.apk > AvsarGo_AI_V14_Android_Test.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: AvsarGo-AI-V14-Android-Test-APK
          path: |
            AvsarGo_AI_V14_Android_Test.apk
            AvsarGo_AI_V14_Android_Test.apk.sha256
            apk-package.txt
            apksigner.jar
          if-no-files-found: error
          retention-days: 14
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser test runtime
        run: |
          npm --prefix /tmp/avsargo-browser install playwright@1.56.1
          /tmp/avsargo-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify rendered app and admin screens
        env:
          PLAYWRIGHT_PATH: /tmp/avsargo-browser/node_modules/playwright
        run: |
          node scripts/visual-check.mjs
          node scripts/document-browser-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AvsarGo-V14-UI-Verification
          path: visual-checks/*.png
          retention-days: 14
