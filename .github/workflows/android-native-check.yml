name: Verify V15 native OCR and advanced autofill
on:
  workflow_dispatch:
  push:
    branches: ['android/v15-advanced-assistant']
    paths: ['app/**', '.github/workflows/android-native-check.yml']
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            test_result=0
            gradle --no-daemon :app:connectedDebugAndroidTest || test_result=$?
            mkdir -p native-verification
            adb pull /sdcard/Android/data/com.avsargo.mobile.beta.v14/files/verification native-verification/ || true
            adb logcat -d -s chromium > native-verification/chromium.log
            exit "$test_result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AvsarGo-V15-Native-Verification
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            native-verification/
          retention-days: 14
