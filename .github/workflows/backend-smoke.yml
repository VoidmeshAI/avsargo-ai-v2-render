name: Verify live AvsarGo admin
on:
  workflow_dispatch:
  push:
    branches: ['android/v13-polished-admin']
    paths: ['server/**', 'scripts/live-backend-check.mjs', '.github/workflows/backend-smoke.yml']
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify live HTTPS endpoints
        run: node scripts/live-backend-check.mjs
