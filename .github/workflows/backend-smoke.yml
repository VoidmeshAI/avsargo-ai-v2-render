name: Verify live AvsarGo admin
on:
  workflow_dispatch:
  push:
    branches: ['android/v15-advanced-assistant']
    paths: ['server/**', 'scripts/live-backend-check.mjs', 'scripts/live-ai-check.mjs', '.github/workflows/backend-smoke.yml']
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify live HTTPS endpoints
        run: node scripts/live-backend-check.mjs
      - name: Verify a real chat with the saved AI key
        if: contains(github.event.head_commit.message, '[verify live AI]')
        run: node scripts/live-advanced-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AvsarGo-V15-Live-Verification
          path: visual-checks/v15-live-results.json
          retention-days: 14
