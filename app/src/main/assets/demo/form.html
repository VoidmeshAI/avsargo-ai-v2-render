<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sample application step 1</title><style>body{font:15px system-ui;background:#f3f6f4;color:#20382c;margin:0;padding:18px}.card{max-width:620px;margin:auto;background:#fff;border-radius:16px;padding:20px}label{display:block;margin:16px 0 6px;font-weight:600}input,select,textarea{box-sizing:border-box;width:100%;padding:12px;border:1px solid #bccfc3;border-radius:9px;font:inherit}button{padding:14px;border:0;border-radius:10px;color:#fff;background:#16715b;margin-top:20px}.note{padding:13px;background:#fff3d7;border-radius:10px}</style></head><body><div class="card"><h1>Sample form · Step 1</h1><p class="note">Local test only. No data leaves this device. Use a dummy profile.</p><form onsubmit="event.preventDefault();location.href='step2.html'"><label for="full">Full name</label><input id="full" name="fullName"><label for="first">First name</label><input id="first" name="firstName"><label for="last">Last name</label><input id="last" name="lastName"><label for="birth">Date of birth</label><input id="birth" type="date" name="dob"><label for="father">Father’s name</label><input id="father" name="fatherName"><label for="email">Email</label><input id="email" type="email" name="email"><label for="phone">Mobile number</label><input id="phone" type="tel" name="mobile"><label for="state">State</label><select id="state" name="state"><option value="0">Select state</option value="DL">Delhi</option><option value="UP">Uttar Pradesh</option><option value="BR">Bihar</option></select><button type="submit">Next step →</button></form></div></body></html>
