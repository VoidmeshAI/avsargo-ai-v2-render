<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; form-action 'none'"><title>Synthetic multi-step application</title><style>body{font:16px sans-serif;background:#fafafa;color:#17221b;margin:20px}label{display:block;margin:12px 0 5px}input:not([type=radio]):not([type=checkbox]),select{width:95%;padding:10px;margin:4px 0}fieldset{margin:15px 0;border:1px solid #ccc}button{padding:12px;margin:12px 0}</style></head><body><h2>Test application · synthetic data</h2><form id="application"><label for="applicant">Name of entrepreneur</label><input id="applicant" name="entrepreneur_name" required><label for="enterprise">Name of enterprise</label><input id="enterprise" name="enterprise_name"><label for="pan">PAN number</label><input id="pan" name="pan_number" maxlength="10"><label for="dobDay">DOB day</label><input id="dobDay" name="dob_day" type="number"><label for="dobMonth">DOB month</label><select id="dobMonth" name="dob_month"><option value="">Select month</option><option value="1">January</option><option value="2">February</option></select><label for="dobYear">DOB year</label><input id="dobYear" name="dob_year" type="number"><fieldset><legend>Gender</legend><label><input type="radio" name="gender" id="male" value="male">Male</label><label><input type="radio" name="gender" id="female" value="female">Female</label></fieldset><label for="email">Email</label><input id="email" name="email" value="kept@example.com"><label for="certificate">Upload marksheet</label><input id="certificate" type="file" accept="application/pdf" aria-label="Upload marksheet"><label for="otp">OTP</label><input id="otp" name="otp"><label><input type="checkbox" id="declaration" name="declaration">I confirm the declaration</label><button id="next" type="button">Next application step</button><div id="nextFields" hidden><label for="state">State</label><select id="state" name="state"><option value="">Select state</option><option value="DL">Delhi</option></select><label for="district">District</label><input id="district" name="district"></div><button id="submit" type="submit">Final submit</button></form><p id="result"></p><script>window.submitted=false;document.getElementById('application').onsubmit=e=>{e.preventDefault();window.submitted=true;};document.getElementById('next').onclick=()=>document.getElementById('nextFields').hidden=false;</script></body></html>
