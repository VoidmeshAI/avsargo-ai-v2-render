<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sample application step 2</title><style>body{font:15px system-ui;background:#f3f6f4;color:#20382c;margin:0;padding:18px}.card{max-width:620px;margin:auto;background:white;border-radius:16px;padding:20px}label{display:block;margin:16px 0 6px;font-weight:600}input,textarea{box-sizing:border-box;width:100%;padding:12px;border:1px solid #bccfc3;border-radius:9px;font:inherit}button{padding:14px;border:0;border-radius:10px;color:white;background:#16715b;margin-top:20px}.note{padding:13px;background:#fff3d7;border-radius:10px}</style></head><body><div class="card"><h1>Sample form · Step 2</h1><p class="note">Assist fills reviewed details. Missing city, PIN, or qualification prompts for input. OTP, CAPTCHA, and Submit stay manual.</p><form onsubmit="event.preventDefault();alert('Sample completed. No application was submitted.')"><label for="address">Address</label><textarea id="address" name="address"></textarea><label for="city">City</label><input id="city" name="city"><label for="zip">Postal PIN code</label><input id="zip" name="pincode"><label for="qualification">Highest qualification</label><input id="qualification" name="qualification"><label for="proof">Supporting document</label><input id="proof" type="file" accept="application/pdf,image/jpeg,image/png"><label for="otp">OTP (manual)</label><input id="otp" name="otp"><label for="captcha">CAPTCHA (manual)</label><input id="captcha" name="captcha"><button type="submit">Complete sample manually</button></form></div></body></html>
